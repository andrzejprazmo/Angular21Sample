<div class="container">
    <h1>Details</h1>
    <div class="card">
        <div class="card-body">
            <ng-container [ngTemplateOutlet]="personDetails" [ngTemplateOutletContext]="{ $implicit: personDetails }"></ng-container>
        </div>
    </div>
</div>

<ng-template #personDetails let-person>
    <div><em>First name:</em> <strong>{{ person.firstName }}</strong></div>
    <div><em>Last name:</em> <strong>{{ person.lastName }}</strong></div>

</ng-template>
